build-and-push:
    name: Build Docker images and push to ACR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ecommerceregistryad2024

      - name: Build and push server image
        env:
          REGISTRY: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        run: |
          docker build -t $REGISTRY/server:${{ github.sha }} -t $REGISTRY/server:latest ./server
          docker push $REGISTRY/server:${{ github.sha }}
          docker push $REGISTRY/server:latest

      - name: Build and push client image
        env:
          REGISTRY: ${{ secrets.REGISTRY_LOGIN_SERVER }}
        run: |
          docker build \
            --build-arg VITE_API_URL=http://${{ secrets.INGRESS_IP }}/api \
            -t $REGISTRY/client:${{ github.sha }} \
            -t $REGISTRY/client:latest ./client
          docker push $REGISTRY/client:${{ github.sha }}
          docker push $REGISTRY/client:latest
